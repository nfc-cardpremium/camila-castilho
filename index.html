<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartão Virtual - Camila Castilho Arquitetura</title>
    <style>
        /* Reset básico e configurações de tela */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ede7e5; /* Cor de fundo que combina com a arte */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Impede rolagem da tela */
        }

        /* Container principal que mantém a proporção exata da imagem (9:16) */
        .card-container {
            position: relative;
            aspect-ratio: 9 / 16;
            height: 100vh; 
            max-width: 100vw;
            /* NOME DA IMAGEM ATUALIZADO AQUI PARA BATER COM SEU GITHUB */
            background-image: url('cartao-camila.jpg'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        /* Ajuste responsivo */
        @media (max-aspect-ratio: 9/16) {
            .card-container {
                width: 100vw;
                height: auto;
            }
        }

        /* Hitboxes - Áreas invisíveis e clicáveis */
        .btn-link {
            position: absolute;
            left: 15%; 
            width: 70%; 
            height: 6.8%; 
            border-radius: 35px; 
            z-index: 10;
            background-color: transparent; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
            cursor: pointer;
        }

        /* Posições verticais dos botões na arte */
        .btn-whatsapp { top: 62.6%; }
        .btn-telefone { top: 70.4%; }
        .btn-instagram { top: 78.3%; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- WhatsApp -->
        <a href="https://wa.me/5512997745432" class="btn-link btn-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"></a>

        <!-- Telefone -->
        <a href="tel:+5512997745432" class="btn-link btn-telefone" aria-label="Telefone"></a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/camila.castilho.arquitetura?igsi=MXVsanV1OXM0dGNjeQ%3D%3D&utm_source=qr" class="btn-link btn-instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram"></a>
    </div>

</body>
</html>
